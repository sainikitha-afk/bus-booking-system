<div class="auth-bg d-flex justify-content-center align-items-center vh-100">
  <div class="auth-card">
    <div class="auth-logo">🚌 BusGo</div>
    <h4 class="text-center mb-4">Welcome Back</h4>

    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input [(ngModel)]="email" type="email" class="form-control" placeholder="you@example.com" />
    </div>

    <div class="mb-4">
      <label class="form-label">Password</label>
      <input [(ngModel)]="password" type="password" class="form-control" placeholder="Password" />
    </div>

    <button class="btn btn-danger w-100 mb-3" (click)="login()" [disabled]="loading">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

    <p class="text-center text-muted mb-0">
      Don't have an account? <a routerLink="/register" class="text-danger">Register</a>
    </p>

    <div class="demo-hint mt-3">
      <small>Demo: niki&#64;test.com / 1234</small>
    </div>
  </div>
</div>
